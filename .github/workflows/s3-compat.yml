name: s3-compat

# Ceph s3-tests is too slow for every pull request (several minutes, plus a
# Python virtualenv). Run it on demand or weekly. A new failure that is not
# listed in tests/s3_compat_expected_failures.txt fails the job.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  s3-tests:
    name: Ceph s3-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Python venv support
        run: sudo apt-get update && sudo apt-get install -y python3-venv

      - name: Run s3-tests
        run: bash tests/s3_compat.sh
