<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <meta name="application-name" content="MaxIO" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MaxIO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>MaxIO</title>
    <script>
      try {
        const root = document.documentElement
        const saved = localStorage.getItem('theme')
        const theme = saved === 'purple' ? 'custom' : saved || 'dark'
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        root.dataset.navStyle = localStorage.getItem('navStyle') === 'floating' ? 'floating' : 'default'
        root.dataset.navItems = localStorage.getItem('navItems') === 'flat' ? 'flat' : '3d'
        if (theme === 'custom') {
          const parts = (localStorage.getItem('customTheme') || '').split(',').map((part) => part.trim())
          const hex = parts.map((part) => (/^#?[0-9a-fA-F]{6}$/.test(part) ? (part.startsWith('#') ? part : '#' + part) : null))
          if (hex.length === 4 && hex.every(Boolean)) {
            const [sidebar, selected, accent, background] = hex
            root.style.setProperty('--theme-sidebar', sidebar)
            root.style.setProperty('--theme-selected', selected)
            root.style.setProperty('--theme-accent', accent)
            root.style.setProperty('--theme-bg', background)
            root.style.setProperty('--color-brand', accent)
            root.style.setProperty('--color-sidebar', sidebar)
            const value = parseInt(background.slice(1), 16)
            const r = (value >> 16) & 255
            const g = (value >> 8) & 255
            const b = value & 255
            const dark = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 < 0.5
            root.classList.toggle('dark', dark)
            root.dataset.theme = 'custom'
          } else {
            root.classList.add('dark')
            root.dataset.theme = 'dark'
          }
        } else {
          const dark = theme === 'dark' || (theme === 'system' && prefersDark)
          root.classList.toggle('dark', dark)
          root.dataset.theme = dark ? 'dark' : 'light'
        }
      } catch (_) {
        document.documentElement.classList.add('dark')
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
