<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <meta name="application-name" content="MaxIO" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MaxIO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>MaxIO</title>
    <script>
      try {
        const saved = localStorage.getItem('theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const shouldUseDark = saved === 'dark' || ((saved === null || saved === 'system') && prefersDark)
        document.documentElement.classList.toggle('dark', shouldUseDark)
        document.documentElement.dataset.navStyle = localStorage.getItem('navStyle') === 'floating' ? 'floating' : 'default'
        document.documentElement.dataset.navItems = localStorage.getItem('navItems') === 'flat' ? 'flat' : '3d'
      } catch (_) {
        document.documentElement.classList.toggle(
          'dark',
          window.matchMedia('(prefers-color-scheme: dark)').matches
        )
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
