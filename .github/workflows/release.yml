name: release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example v1.0.0). Must match Cargo.toml."
        required: true
        type: string
      dry_run:
        description: "Build only. Leave this on to skip the image push and the GitHub Release."
        required: false
        type: boolean
        default: true

# Tag pushes of a stable version publish, including the :latest tags.
# A pre-release tag (v1.0.0-rc.1) publishes that version and does not move :latest.
# workflow_dispatch publishes only when dry_run is false.
# Pull requests build the Linux amd64 binary and image and publish nothing.
# Which targets run is chosen in the plan job. Job-level if cannot read matrix.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GITHUB_REGISTRY: ghcr.io
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: coollabsio/maxio

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      docker: ${{ steps.matrix.outputs.docker }}
      publish: ${{ steps.matrix.outputs.publish }}
      latest: ${{ steps.matrix.outputs.latest }}
      prerelease: ${{ steps.matrix.outputs.prerelease }}
      tag: ${{ steps.matrix.outputs.tag }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, tomllib
          event = os.environ["EVENT_NAME"]
          raw = os.environ.get("INPUT_VERSION", "")
          dry = os.environ.get("INPUT_DRY_RUN", "")
          ref = os.environ.get("GITHUB_REF_NAME", "")
          semver = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          )
          if event == "workflow_dispatch":
              tag = raw.strip()
          elif event == "push":
              tag = ref.strip()
          else:
              tag = ""
          version = ""
          if tag:
              if not tag.startswith("v") or not semver.fullmatch(tag[1:]):
                  raise SystemExit(f"refusing tag {tag!r}: expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease")
              version = tag[1:]
              with open("Cargo.toml", "rb") as fh:
                  cargo = tomllib.load(fh)["package"]["version"]
              if cargo != version:
                  raise SystemExit(f"Cargo version {cargo} does not match tag {tag}")
          publish = event == "push" or (event == "workflow_dispatch" and dry != "true")
          stable = bool(version) and "-" not in version
          latest = publish and stable
          prerelease = publish and bool(version) and not stable
          amd64 = {"target": "x86_64-unknown-linux-musl", "runner": "ubuntu-24.04", "artifact": "maxio-linux-amd64"}
          builds = [
              amd64,
              {"target": "aarch64-unknown-linux-musl", "runner": "ubuntu-24.04-arm", "artifact": "maxio-linux-arm64"},
              {"target": "x86_64-apple-darwin", "runner": "macos-latest", "artifact": "maxio-macos-amd64"},
              {"target": "aarch64-apple-darwin", "runner": "macos-latest", "artifact": "maxio-macos-arm64"},
          ]
          images = [
              {"arch": "amd64", "platform": "linux/amd64", "runner": "ubuntu-24.04"},
              {"arch": "aarch64", "platform": "linux/arm64", "runner": "ubuntu-24.04-arm"},
          ]
          if event == "pull_request":
              builds = [amd64]
              images = [images[0]]
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"publish={'true' if publish else 'false'}\n")
              fh.write(f"latest={'true' if latest else 'false'}\n")
              fh.write(f"prerelease={'true' if prerelease else 'false'}\n")
              fh.write(f"tag={tag}\n")
              fh.write(f"version={version}\n")
              fh.write(f"build={json.dumps(builds)}\n")
              fh.write(f"docker={json.dumps(images)}\n")
          print(f"event={event} publish={publish} latest={latest} prerelease={prerelease} tag={tag or '<none>'}")
          PY

  build:
    name: Build ${{ matrix.artifact }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}

    steps:
      - uses: actions/checkout@v4

      # Matches rust-toolchain.toml. Cargo.toml rust-version (1.89) is the MSRV.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          linker_env="CARGO_TARGET_$(printf '%s' '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER"
          echo "${linker_env}=musl-gcc" >> "$GITHUB_ENV"

      - name: Select macOS SDK
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: ui

      - name: Build frontend
        run: bun run build
        working-directory: ui

      - name: Build binary
        env:
          SKIP_FRONTEND: "1"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Confirm the Linux binary is static
        if: contains(matrix.target, 'linux-musl')
        run: |
          bin="target/${{ matrix.target }}/release/maxio"
          file "$bin"
          # Some ldd builds exit 0 and print "statically linked". A dynamic
          # binary lists libraries with "=>".
          ldd_out="$(ldd "$bin" 2>&1 || true)"
          echo "$ldd_out"
          if printf '%s\n' "$ldd_out" | grep -q '=>'; then
            echo "expected a statically linked musl binary"
            exit 1
          fi

      - name: Package
        run: |
          VERSION="$(python3 - <<'PYV'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PYV
          )"
          ARCHIVE="${{ matrix.artifact }}-${VERSION}.tar.gz"
          cp "target/${{ matrix.target }}/release/maxio" maxio
          tar czf "${ARCHIVE}" maxio
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: maxio-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum ./*.tar.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS

  docker:
    name: Docker ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker) }}

    steps:
      - uses: actions/checkout@v4

      - name: Image version
        id: version
        run: |
          VERSION="$(python3 - <<'PYV'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PYV
          )"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets are unset; this build publishes to GHCR only."
          fi

      - name: Image tags
        id: tags
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
          DOCKERHUB: ${{ steps.dockerhub.outputs.present }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "tags<<EOF"
            echo "${GITHUB_REGISTRY}/${IMAGE_NAME}:${VERSION}-${ARCH}"
            if [ "$PUBLISH" = "true" ] && [ "$DOCKERHUB" = "true" ]; then
              echo "${DOCKER_REGISTRY}/${IMAGE_NAME}:${VERSION}-${ARCH}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ${{ env.DOCKER_REGISTRY }}
        if: needs.plan.outputs.publish == 'true' && steps.dockerhub.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ needs.plan.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=MaxIO
            org.opencontainers.image.description=S3-compatible object storage server
            org.opencontainers.image.source=https://github.com/coollabsio/maxio
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  docker-manifest:
    name: Docker manifest
    needs: [plan, docker]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ${{ env.DOCKER_REGISTRY }}
        if: steps.dockerhub.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch manifest on ${{ env.GITHUB_REGISTRY }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          args=(
            "${GITHUB_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64"
            "${GITHUB_REGISTRY}/${IMAGE_NAME}:${VERSION}-aarch64"
            --tag "${GITHUB_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          )
          if [ "$LATEST" = "true" ]; then
            args+=(--tag "${GITHUB_REGISTRY}/${IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create "${args[@]}"

      - name: Publish multi-arch manifest on ${{ env.DOCKER_REGISTRY }}
        if: steps.dockerhub.outputs.present == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          args=(
            "${DOCKER_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64"
            "${DOCKER_REGISTRY}/${IMAGE_NAME}:${VERSION}-aarch64"
            --tag "${DOCKER_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          )
          if [ "$LATEST" = "true" ]; then
            args+=(--tag "${DOCKER_REGISTRY}/${IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create "${args[@]}"

  release:
    name: GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: maxio-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum ./*.tar.gz | tee SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Body comes from merged pull requests and commits since the previous tag.
          tag_name: ${{ needs.plan.outputs.tag }}
          name: MaxIO ${{ needs.plan.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          files: |
            *.tar.gz
            SHA256SUMS
