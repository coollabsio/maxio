# Dev-profile snippet. Paste under the [package] table.
# Measured on MaxIO (single package, rustc 1.97.1, 4 vCPU):
# cold cargo build 46.86s -> 40.66s after this change alone.
# Do not set dependency opt-level = 1. On MaxIO that made the cold
# build 69.77s and cargo check 44.08s.

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
